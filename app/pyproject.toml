[project]
name = "student-portal"
version = "0.2.0"
description = "Система управління студентами — навчальний застосунок курсу «Тестування та супровід ПЗ»"
readme = "README.md"
authors = [
    { name = "Козелко Віталій" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
student-portal = "student_portal:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
