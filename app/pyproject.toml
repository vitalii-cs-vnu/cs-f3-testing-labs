[project]
name = "student-portal"
version = "0.10.0"
description = "Система управління студентами - навчальний застосунок курсу «Тестування та супровід ПЗ»"
readme = "README.md"
authors = [
    { name = "Козелко Віталій" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic[email]>=2.14.1",
    "python-multipart==0.0.22",
    "uvicorn>=0.54.0",
]

[project.scripts]
student-portal = "student_portal:main"
student-portal-dean = "student_portal.dean:main"
student-portal-api = "student_portal.api:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170",
    "jsonschema>=4.26.0",
    "mutmut>=3.8",
    "pact-python>=4",
    "pytest>=9.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "pytest-playwright>=0.10",
    "ruff>=0.17.1",
    "schemathesis>=4.32.5",
    "testcontainers>=4.15",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
